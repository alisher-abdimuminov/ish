{% extends 'base.html' %} {% block content %}
<div
	class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100"
>
	<h2 class="text-2xl font-bold text-center text-gray-900 mb-6">
		Tizimga kirish
	</h2>
	<form method="post" class="space-y-4">
		{% csrf_token %}
		<div>
			<label class="block text-sm font-medium text-gray-700 mb-1"
				>Telefon raqam</label
			>
			<input
				type="text"
				name="username"
				required
				class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition border-gray-300"
				placeholder="+998901234567"
			/>
		</div>
		<div>
			<label class="block text-sm font-medium text-gray-700 mb-1"
				>Parol</label
			>
			<input
				type="password"
				name="password"
				required
				class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition border-gray-300"
				placeholder="••••••••"
			/>
		</div>
		<button
			type="submit"
			class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition"
		>
			Kirish
		</button>
	</form>
	<p class="mt-4 text-center text-sm text-gray-600">
		Akkountingiz yo'qmi?
		<a
			href="{% url 'register' %}"
			class="text-blue-600 hover:underline font-medium"
			>Ro'yxatdan o'tish</a
		>
	</p>
</div>
{% endblock %}
